[project]
name = "zcagent"
version = "0.1.0"
description = "A lightweight local Agent foundation for ZhiCe-Agent."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "ZhiCe-Agent contributors" }
]
dependencies = [
    "colorama>=0.4.6",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "litellm>=1.0.0",
    "mcp>=1.27.0,<2",
    "PyYAML>=6.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.6.0",
]

[project.scripts]
zcagent = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".tmp/pytest_cache"
addopts = "-m 'not integration' -n 4"
markers = [
    "integration: starts real subprocesses or local protocol servers",
]

