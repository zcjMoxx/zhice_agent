<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ZhiCe-Agent Ops</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1118;--panel:#151b25;--panel-2:#101620;--line:#2a3546;--line-strong:#3c4c62;--text:#edf3ff;--soft:#9eabc0;--blue:#71a7ff;--blue-strong:#4388ee;--green:#3bd18b;--amber:#f0b74a;--red:#ff7070;--shadow:0 18px 50px rgba(0,0,0,.22)}
    *{box-sizing:border-box}html{scrollbar-width:thin;scrollbar-color:#50627b #0d1118}body{margin:0;background:radial-gradient(circle at 88% 0,rgba(69,111,173,.12),transparent 34%),var(--bg);color:var(--text);font:14px/1.55 Inter,"Segoe UI",system-ui,sans-serif}button,input{font:inherit}button{color:inherit}code,.mono,pre{font-family:"Cascadia Code","SFMono-Regular",Consolas,monospace}
    *::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:#0d1118}*::-webkit-scrollbar-thumb{border:2px solid #0d1118;border-radius:999px;background:#50627b}*::-webkit-scrollbar-thumb:hover{background:#7488a4}*::-webkit-scrollbar-corner{background:#0d1118}
    .shell{width:min(1220px,calc(100% - 36px));margin:0 auto;padding:34px 0 48px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:24px}.brand h1{margin:0;font-size:32px;letter-spacing:-.04em}.brand p{margin:8px 0 0;color:var(--soft)}.brand code{color:#8fc5ff}.connection{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(21,27,37,.82);color:var(--soft);white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(240,183,74,.12)}.dot.ok{background:var(--green);box-shadow:0 0 0 4px rgba(59,209,139,.12)}.dot.error{background:var(--red);box-shadow:0 0 0 4px rgba(255,112,112,.12)}
    .view-tabs{display:inline-flex;gap:5px;padding:5px;margin-bottom:18px;border:1px solid var(--line);border-radius:12px;background:#101620}.view-tabs button{min-width:126px;padding:10px 16px;border:0;border-radius:8px;background:transparent;color:var(--soft);font-weight:750;cursor:pointer;transition:.15s ease}.view-tabs button:hover{color:var(--text);background:#192231}.view-tabs button.active{color:#07101f;background:var(--blue);box-shadow:0 2px 0 #315d9f}.view-tabs button:active{transform:translateY(1px)}.view-tabs button:focus-visible,.action:focus-visible,input:focus-visible{outline:3px solid rgba(113,167,255,.42);outline-offset:2px}
    .view{display:none}.view.active{display:block}.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.section{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,rgba(24,31,43,.98),rgba(18,24,34,.98));box-shadow:var(--shadow)}.card{min-height:126px;padding:20px}.card span{display:block;color:var(--soft);font-size:13px}.card strong{display:block;margin-top:11px;overflow:hidden;font-size:25px;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}.card small{display:block;margin-top:9px;color:#7f8ea5}.state-running,.health-healthy{color:var(--green)}.state-error,.state-missing,.state-stopped,.health-unhealthy{color:var(--red)}.state-restarting,.health-starting{color:var(--amber)}
    .section{margin-top:14px;padding:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:16px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:3px 0 0;color:var(--soft)}.actions{display:flex;flex-wrap:wrap;gap:9px}.action{min-height:40px;padding:9px 14px;border:1px solid var(--line-strong);border-radius:9px;background:#1a2432;font-weight:750;cursor:pointer;box-shadow:0 2px 0 #0a0e14;transition:filter .14s ease,transform .08s ease,box-shadow .08s ease}.action:hover{filter:brightness(1.14)}.action:active{transform:translateY(2px);box-shadow:none}.action.primary{border-color:#71a7ff;background:var(--blue);color:#07101f;box-shadow:0 2px 0 #315d9f}.action.warning{border-color:#8b6530;background:#3a2b17;color:#ffd58b}.action.paused{border-color:#8b6530;background:#f0b74a;color:#171006}.action:disabled{cursor:wait;opacity:.62;transform:none;box-shadow:none}
    .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0}.facts div{min-width:0;padding:12px;border:1px solid rgba(73,91,116,.45);border-radius:10px;background:#101620}.facts dt{color:var(--soft);font-size:12px}.facts dd{margin:6px 0 0;overflow-wrap:anywhere}.diagnostic{display:none;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#0d131c;color:#c6d2e5;white-space:pre-wrap;overflow-wrap:anywhere}.diagnostic.visible{display:block}
    .log-box{height:min(49vh,520px);margin:0;padding:14px;border:1px solid #273244;border-radius:10px;background:#0b1017;overflow:auto;color:#b9c7dc;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.log-line{display:block;min-height:1.42em}.log-time,.log-level-info,.log-component-ws{color:#3bd18b}.log-level-debug,.log-action-agent{color:#35cde2}.log-level-warning,.log-action-tool{color:#eab308}.log-level-error,.log-level-critical{color:#ff7070;font-weight:700}.log-action-web{color:#d986ff}.log-action-gateway,.log-component-gateway{color:#71a7ff}.log-fields{color:#b9c7dc}
    .terminal-panel{position:relative;min-height:720px;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#0b0f15;box-shadow:var(--shadow)}.terminal-frame{display:none;width:100%;height:720px;border:0;background:#111318}.terminal-frame.active{display:block}.local-terminal{display:none;min-height:720px;padding:18px;background:#0b0f15;font:14px/1.55 "Cascadia Code","SFMono-Regular",Consolas,monospace}.local-terminal.active{display:flex;flex-direction:column}.terminal-output{min-height:0;flex:1;margin:0 0 12px;overflow:auto;color:#d8e2f2;white-space:pre-wrap;overflow-wrap:anywhere}.terminal-form{display:flex;align-items:center;gap:9px;border-top:1px solid #273244;padding-top:13px}.prompt{color:#71a7ff;font-weight:700}.terminal-form input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#edf3ff;font:inherit}.terminal-hint{position:absolute;right:14px;top:13px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:rgba(16,22,32,.9);color:var(--soft);font-size:12px;pointer-events:none}
    .empty{color:var(--soft)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:820px){.shell{width:min(100% - 22px,1220px);padding-top:20px}.topbar{flex-direction:column}.summary-grid,.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.section-head{align-items:flex-start;flex-direction:column}.terminal-panel,.terminal-frame,.local-terminal{min-height:620px;height:620px}}
    @media(max-width:520px){.summary-grid,.facts{grid-template-columns:1fr}.view-tabs{display:flex}.view-tabs button{min-width:0;flex:1}.brand h1{font-size:28px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><h1>ZhiCe-Agent Ops</h1><p><span id="mode-copy">正在连接运行目标</span> · <code id="target-copy">—</code></p></div>
    <div class="connection"><i id="connection-dot" class="dot"></i><span id="connection-copy">连接中</span></div>
  </header>
  <nav class="view-tabs" aria-label="Ops view">
    <button id="monitor-tab" class="active" type="button" aria-selected="true">监控面板</button>
    <button id="terminal-tab" type="button" aria-selected="false">运维终端</button>
  </nav>
  <section id="monitor-view" class="view active">
    <div class="summary-grid">
      <article class="card"><span>运行状态</span><strong id="state-value">连接中</strong><small id="state-detail">等待目标响应</small></article>
      <article class="card"><span>健康状态</span><strong id="health-value">—</strong><small id="health-detail">Gateway health</small></article>
      <article class="card"><span>运行时长</span><strong id="uptime-value">—</strong><small id="uptime-detail">当前实例</small></article>
      <article class="card"><span>固定目标</span><strong id="target-value">—</strong><small id="target-type">—</small></article>
    </div>
    <section class="section">
      <header class="section-head"><div><h2>运行概况</h2><p>只展示当前固定 Gateway 或容器的安全摘要。</p></div><div class="actions"><button id="diagnose-button" class="action" type="button">运行诊断</button><button id="restart-button" class="action warning" type="button">重启目标</button></div></header>
      <dl id="facts" class="facts"></dl><pre id="diagnostic" class="diagnostic"></pre>
    </section>
    <section class="section">
      <header class="section-head"><div><h2>Gateway 日志</h2><p>自动跟随人类可读终端输出，不直接展示 trace JSONL。</p></div><div class="actions"><button id="follow-button" class="action primary" type="button" aria-pressed="false">暂停跟随</button></div></header>
      <pre id="logs" class="log-box" tabindex="0" aria-live="polite"></pre>
    </section>
  </section>
  <section id="terminal-view" class="view">
    <div class="terminal-panel">
      <span id="terminal-hint" class="terminal-hint">Restricted mode</span>
      <iframe id="terminal-frame" class="terminal-frame" title="ZhiCe restricted server terminal"></iframe>
      <div id="local-terminal" class="local-terminal">
        <pre id="terminal-output" class="terminal-output" aria-live="polite"></pre>
        <form id="terminal-form" class="terminal-form"><label class="sr-only" for="terminal-input">固定运维命令</label><span class="prompt">zhice-ops&gt;</span><input id="terminal-input" autocomplete="off" spellcheck="false" maxlength="120"></form>
      </div>
    </div>
  </section>
</main>
<script>
const q=(selector)=>document.querySelector(selector);
const state={meta:null,following:true,terminalFollowing:false,terminalClosed:false,statusTimer:null,logTimer:null,terminalLogTimer:null};
const modeLabels={local_process:'本地进程',local_docker:'本地 Docker',server_docker:'云服务器'};
const safeText=(value,fallback='—')=>value===null||value===undefined||value===''?fallback:String(value);
function setConnection(kind,text){q('#connection-dot').className='dot '+kind;q('#connection-copy').textContent=text}
function setView(name){const monitor=name==='monitor';q('#monitor-view').classList.toggle('active',monitor);q('#terminal-view').classList.toggle('active',!monitor);q('#monitor-tab').classList.toggle('active',monitor);q('#terminal-tab').classList.toggle('active',!monitor);q('#monitor-tab').setAttribute('aria-selected',String(monitor));q('#terminal-tab').setAttribute('aria-selected',String(!monitor));if(!monitor&&state.meta?.terminal_kind==='local')q('#terminal-input').focus()}
function formatDuration(value){const total=Math.max(0,Number(value)||0);if(!total)return '刚刚启动';const days=Math.floor(total/86400),hours=Math.floor(total%86400/3600),minutes=Math.floor(total%3600/60),seconds=Math.floor(total%60);return [days&&`${days}天`,hours&&`${hours}小时`,minutes&&`${minutes}分`,!days&&!hours&&`${seconds}秒`].filter(Boolean).join(' ')}
function statusState(data){return safeText(data.status||data.state,'unknown').toLowerCase()}
function addFact(label,value){const wrap=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=safeText(value);wrap.append(dt,dd);q('#facts').append(wrap)}
function renderStatus(data){const current=statusState(data),health=safeText(data.health,data.running===true||current==='running'?'healthy':'unknown').toLowerCase();q('#state-value').textContent=current;q('#state-value').className='state-'+current;q('#state-detail').textContent=data.exit_code===null||data.exit_code===undefined?'进程或容器状态':`Exit code ${data.exit_code}`;q('#health-value').textContent=health;q('#health-value').className='health-'+health;q('#health-detail').textContent=data.oom_killed?'检测到 OOMKilled':'Gateway health';q('#uptime-value').textContent=formatDuration(data.uptime_seconds);q('#uptime-detail').textContent=safeText(data.started_at,'当前实例');q('#target-value').textContent=safeText(data.target_name||data.target);q('#target-type').textContent=safeText(data.target_type);q('#facts').replaceChildren();[['PID',data.pid],['镜像',data.image],['重启次数',data.restart_count],['Ops 地址',data.ops_url]].forEach(([label,value])=>{if(value!==undefined&&value!==null&&value!=='')addFact(label,value)});setConnection(current==='running'?'ok':current==='restarting'?'':'error',current==='running'?'连接正常':'目标 '+current)}
function logPart(text,className){const node=document.createElement('span');node.className=className;node.textContent=text;return node}
function actionClass(action){const value=action.trim();if(value.startsWith('TOOL '))return 'tool';for(const name of ['agent','web','gateway'])if(value===name||value.startsWith(name+'.'))return name;return 'default'}
function renderLine(line){const row=document.createElement('span');row.className='log-line';let match=line.match(/^(\[[^\]]+\]) \| (DEBUG|INFO|WARNING|ERROR|CRITICAL) \| ([^|]+)(.*)$/);if(match){const level=match[2].toLowerCase(),action=actionClass(match[3]);row.append(logPart(match[1],'log-time'),' | ',logPart(match[2],'log-level-'+level),' | ',logPart(match[3],'log-action-'+action),logPart(match[4],'log-fields'));return row}match=line.match(/^(DEBUG|INFO|WARNING|ERROR|CRITICAL):\s*(\[[^\]]+\])?\s*(.*)$/);if(match){const level=match[1].toLowerCase(),component=match[2]?match[2].slice(1,-1):'';row.append(logPart(match[1]+':','log-level-'+level),' ');if(match[2])row.append(logPart(match[2],'log-component-'+component),' ');row.append(logPart(match[3],'log-fields'));return row}row.textContent=line;return row}
function normalizeLogs(payload){if(Array.isArray(payload.lines))return payload.lines.map(String);return safeText(payload.logs,'').split(/\r?\n/).filter((line,index,all)=>line||index<all.length-1)}
function renderLogs(lines){const box=q('#logs'),stick=state.following||box.scrollHeight-box.scrollTop-box.clientHeight<28,fragment=document.createDocumentFragment();lines.forEach(line=>fragment.append(renderLine(line)));box.replaceChildren(fragment);if(stick)box.scrollTop=box.scrollHeight}
async function api(path,options){const response=await fetch(path,{cache:'no-store',...options});const payload=await response.json().catch(()=>({message:'响应格式无效'}));if(!response.ok)throw new Error(payload.message||`HTTP ${response.status}`);return payload}
async function loadStatus(){try{renderStatus(await api('/api/status'))}catch(error){setConnection('error','连接失败');q('#state-value').textContent='unavailable';q('#state-detail').textContent=String(error.message||error)}}
async function loadLogs(){if(!state.following)return;try{renderLogs(normalizeLogs(await api('/api/logs?lines=500')))}catch(error){renderLogs([`日志读取失败：${String(error.message||error)}`])}}
function renderFollow(){q('#follow-button').textContent=state.following?'暂停跟随':'继续跟随';q('#follow-button').classList.toggle('paused',!state.following);q('#follow-button').setAttribute('aria-pressed',String(!state.following))}
async function diagnose(){const button=q('#diagnose-button'),output=q('#diagnostic');button.disabled=true;button.textContent='诊断中…';output.classList.add('visible');output.textContent='正在收集固定目标的安全诊断信息…';try{const data=await api('/api/diagnose');output.textContent=safeText(data.output,JSON.stringify(data,null,2));button.textContent='诊断完成'}catch(error){output.textContent=`诊断失败：${String(error.message||error)}`;button.textContent='诊断失败'}setTimeout(()=>{button.textContent='运行诊断';button.disabled=false},900)}
async function restart(){if(!confirm(`确认重启固定目标 ${safeText(state.meta?.target_name)}？`))return;const button=q('#restart-button');button.disabled=true;button.textContent='重启中…';try{await api('/api/restart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:'restart'})});await loadStatus();button.textContent='重启完成'}catch(error){button.textContent='重启失败';q('#diagnostic').classList.add('visible');q('#diagnostic').textContent=String(error.message||error)}setTimeout(()=>{button.textContent='重启目标';button.disabled=false},1100)}
function terminalWrite(text){const output=q('#terminal-output');output.textContent+=String(text);output.scrollTop=output.scrollHeight}
function stopTerminalFollow(){if(state.terminalLogTimer){clearInterval(state.terminalLogTimer);state.terminalLogTimer=null}if(state.terminalFollowing){state.terminalFollowing=false;terminalWrite('\nLog follow stopped\nzhice-ops> ')}}
async function runTerminalLogs(){try{const lines=normalizeLogs(await api('/api/logs?lines=500'));q('#terminal-output').textContent=`ZhiCe-Agent Ops - restricted mode\nType 'help' for the fixed command list.\n\n${lines.join('\n')}`;q('#terminal-output').scrollTop=q('#terminal-output').scrollHeight}catch(error){terminalWrite(`\n${String(error.message||error)}`)}}
async function runCommand(command){terminalWrite(`${command}\n`);if(command.trim()==='logs-follow'){state.terminalFollowing=true;await runTerminalLogs();state.terminalLogTimer=setInterval(runTerminalLogs,1000);return}try{const result=await api('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command})});if(result.output)terminalWrite(String(result.output).replace(/\n?$/,'\n'));if(result.exit){state.terminalClosed=true;q('#terminal-input').disabled=true;terminalWrite('Session closed. Refresh the page to reconnect.\n');return}}catch(error){terminalWrite(`Command rejected: ${String(error.message||error)}\n`)}terminalWrite('zhice-ops> ')}
async function loadMeta(){state.meta=await api('/api/meta');const mode=modeLabels[state.meta.mode]||safeText(state.meta.mode,'Ops');q('#mode-copy').textContent=`${mode} · Restricted mode`;q('#target-copy').textContent=safeText(state.meta.target_name);q('#terminal-hint').textContent=state.meta.config_supported?'Restricted mode · 服务器配置命令可用':'Restricted mode · 通用固定命令';if(state.meta.terminal_kind==='ttyd'){const frame=q('#terminal-frame');frame.classList.add('active');if(!frame.getAttribute('src'))frame.setAttribute('src',safeText(state.meta.terminal_url,'/terminal/'))}else{q('#local-terminal').classList.add('active');terminalWrite("ZhiCe-Agent Ops - restricted mode\nType 'help' for the fixed command list.\nzhice-ops> ")}}
q('#monitor-tab').addEventListener('click',()=>setView('monitor'));q('#terminal-tab').addEventListener('click',()=>setView('terminal'));q('#follow-button').addEventListener('click',()=>{state.following=!state.following;renderFollow();if(state.following)loadLogs()});q('#logs').addEventListener('scroll',()=>{const box=q('#logs');if(box.scrollHeight-box.scrollTop-box.clientHeight>=28&&state.following){state.following=false;renderFollow()}});q('#diagnose-button').addEventListener('click',diagnose);q('#restart-button').addEventListener('click',restart);q('#terminal-form').addEventListener('submit',event=>{event.preventDefault();if(state.terminalClosed||state.terminalFollowing)return;const input=q('#terminal-input'),command=input.value.trim();input.value='';if(command)runCommand(command)});q('#terminal-input').addEventListener('keydown',event=>{if(event.ctrlKey&&event.key.toLowerCase()==='c'&&state.terminalFollowing){event.preventDefault();stopTerminalFollow()}});
renderFollow();loadMeta().then(()=>Promise.all([loadStatus(),loadLogs()])).catch(error=>{setConnection('error','初始化失败');q('#state-detail').textContent=String(error.message||error)});state.statusTimer=setInterval(loadStatus,3000);state.logTimer=setInterval(loadLogs,1000);
</script>
</body>
</html>
