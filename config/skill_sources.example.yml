# Skill source sync behavior.
sync:
  # zcagent 启动时是否同步 Skill source。
  # 可选值：never | always
  on_startup: always

  # 同步日志策略。
  # changes_only：只打印发生变更或失败的同步结果。
  # always：每次都打印同步摘要，包括已经是最新状态的 source。
  log: changes_only

  # 预留后台同步结构，当前不会启动后台轮询。
  background:
    enabled: false
    interval_seconds: 0

sources:
  - name: zhice-official
    # Source 名称。用于日志、命名空间和命令，例如：
    # /skills sync zhice-official

    # 此 source 是否参与同步。
    sync: true

    # 本地技能仓库根目录。存在时优先使用。
    # 仓库结构固定为 local_dir/skills/{skill_name}/SKILL.md。
    local_dir: "${ZHICE_AGENT_SKILL_REPO}"

    # 本地仓库不存在时的远端兜底地址。
    git_url: "https://example.com/skills.git"

    # Git branch，缺省为 master。
    target: "master"
