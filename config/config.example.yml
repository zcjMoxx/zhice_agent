schema_version: 1

context:
  full_history:
    enabled: true
  history_query:
    enabled: true
    planner_fallback: true
  compaction:
    enabled: true
    trigger_budget_ratio: 0.85
    recent_keep_ratio: 0.15
    post_compaction_max_ratio: 0.35
    min_recent_turns: 8
    background_enabled: true
    background_trigger_budget_ratio: 0.80
  retrieval:
    enabled: true
    top_k: 6
    semantic_weight: 0.45
    lexical_weight: 0.30
    entity_weight: 0.15
    anchor_weight: 0.08
    recency_weight: 0.02
    min_semantic_score: 0.15
  index:
    backend: sqlite

skills:
  sync:
    on_startup: always
    log: changes_only
    background:
      enabled: false
      interval_seconds: 0
  sources:
    - name: zhice-official
      sync: true
      local_dir: "${ZHICE_AGENT_SKILL_REPO}"

subagents:
  enabled: true
  max_parallel: 3
  max_tasks_per_call: 4
  max_depth: 1
  max_subagents_per_parent_turn: 6
  max_batches_per_parent_turn: 1
  max_batch_result_chars: 32000
  profiles:
    # Travel planning injects its five fixed read-only profiles only for a
    # travel Turn. Keep ordinary chat profiles here; an explicit same-name
    # profile can override a built-in travel profile when necessary.
    explorer:
      description: Inspect workspace files and public read-only tools for a bounded research task.
      tools: [read_file, list_dir, search_files]
      initial_tools: [read_file, list_dir, search_files]
      denied_tools: [delegate_tasks, write_file, apply_patch, exec]
      allowed_skills: []
      preload_skills: []
      workspace_mode: shared_readonly
      max_tool_iterations: 4
      timeout_seconds: 90
      max_result_chars: 8000
      allow_model_invocation: true
      model_role: inherit

channels:
  qq:
    enabled: false
    transport: websocket
    # Each account may set http_timeout_seconds: 15 (allowed range: 1..60).
    # Public deployments must explicitly set web_base_url for every enabled account.
    # 需启用账号时请填写：web_base_url: "请填写可公网访问的服务地址"
    # Keep accounts empty until real credentials and the real reachable URL are configured.
    accounts: []
  weixin:
    enabled: false
    transport: sidecar_stdio
    node_path: node
    sidecar_entry: integrations/weixin_sidecar/dist/main.js
    binding_timeout_seconds: 480
    max_parallel_conversations: 8
    text_chunk_limit: 4000

hooks:
  version: 1
  entries: []

mcp:
  servers:
    open-meteo:
      command: python
      args: [-m, integrations.open_meteo_mcp.server]
      startup_timeout_seconds: 15
      connect_timeout_seconds: 15
      call_timeout_seconds: 30
    # Enable after setting AMAP_MAPS_API_KEY in config/.env, then verify the
    # current upstream Tool Catalog before production use.
    # amap-maps:
    #   command: mcp-amap
    #   args: []
    #   env:
    #     AMAP_MAPS_API_KEY: "${AMAP_MAPS_API_KEY}"
    # Enable Tavily only after confirming its current authentication contract.
    # tavily:
    #   url: https://mcp.tavily.com/mcp
    #   transport: streamable_http
    #   proxy_mode: direct
    #   headers:
    #     Authorization: "Bearer ${TAVILY_API_KEY}"
    # Configure a reviewed query-only 12306 MCP command in the runtime file.
    # Never describe this community source as an official booking service.
    # 12306:
    #   command: 12306-mcp
    #   args: []
    #   startup_timeout_seconds: 60
    #   connect_timeout_seconds: 30
    #   call_timeout_seconds: 30
    # Enable the bundled catalog-level XHS adapter only with an isolated
    # upstream service account, Cookie volume, and explicit environment values.
    # xhs-readonly:
    #   command: python
    #   args: [-m, integrations.xhs_readonly_mcp.server]
    #   env:
    #     XHS_READONLY_UPSTREAM_URL: "${XHS_READONLY_UPSTREAM_URL}"
    #     XHS_READONLY_COOKIE_DIR: "${XHS_READONLY_COOKIE_DIR}"
    #     XHS_READONLY_COOKIE_FILE: "${XHS_READONLY_COOKIE_FILE}"
    #     XHS_READONLY_HTTP_HOST_ALLOWLIST: "${XHS_READONLY_HTTP_HOST_ALLOWLIST}"
    # For local process mode, a loopback XHS_READONLY_UPSTREAM_URL makes the
    # Gateway supervise the fixed binary under integrations/xhs/bin. Docker
    # and remote HTTPS upstreams remain independently managed sidecars.
    # Travel planning exposes the bundled search_travel_hotels Tool directly after
    # the Owner stores one Ctrip credential in the MCP administration page; no MCP
    # server entry is required. The optional server below is only for standalone
    # interoperability/smoke use and never exposes booking, payment, cancellation,
    # credential, or generic browser tools.
    # hotel-browser:
    #   command: python
    #   args: [-m, integrations.hotel_browser_mcp.server]
    #   env:
    #     ZHICE_AGENT_WORKSPACE: "${ZHICE_AGENT_WORKSPACE}"
    #     HOTEL_BROWSER_CHANNEL: chrome
    #     # When no runtime config/.env is mounted, explicitly forward deployment Secrets:
    #     # ZHICE_CTRIP_USERNAME: "${ZHICE_CTRIP_USERNAME}"
    #     # ZHICE_CTRIP_PASSWORD: "${ZHICE_CTRIP_PASSWORD}"

travel:
  enabled: true
  max_evidence_items: 40
  max_plan_bytes: 524288

workflows:
  enabled: true
  engine: native
  max_workflows_per_user: 20
  max_active_schedules_per_user: 10
  max_nodes_per_workflow: 30
  max_edges_per_workflow: 60
  max_global_workers: 4
  max_daily_runs_per_user: 100
  max_daily_official_emails_per_user: 10
  max_daily_personal_emails_per_user: 20
  default_timezone: Asia/Shanghai
  default_misfire_grace_seconds: 900
  allowed_query_tools:
    - mcp__open-meteo__geocode_place
    - mcp__open-meteo__get_forecast
    - mcp__open-meteo__get_historical_weather
    - mcp__amap-maps__maps_text_search
    - mcp__amap-maps__maps_search_detail
    - mcp__tavily__tavily_search
    - mcp__12306__get-tickets
    - mcp__xhs-readonly__search_notes
    - mcp__xhs-readonly__get_note_detail
  allowed_action_tools: []

official_email:
  enabled: false
  provider: smtp
  host: "${ZHICE_SMTP_HOST}"
  port: 587
  username: "${ZHICE_SMTP_USERNAME}"
  password: "${ZHICE_SMTP_PASSWORD}"
  from_address: "${ZHICE_SMTP_FROM}"

logging: {}

# Non-secret projection of the independently protected Ops terminal.
# Production deployments must use an explicit HTTPS URL protected by
# Cloudflare Tunnel + Access. The main Web never proxies terminal traffic.
operations:
  terminal:
    enabled: false
    # 启用后请填写受保护的 HTTPS 运维终端地址；本机调试可填写 loopback HTTP 地址。
    url: ""
    presentation: both
