# 完整公共配置示例。复制为运行态 config.yml 后，按环境填写 config/.env。
# ${...} 均为环境变量占位，不得在本文件写入真实 Secret。
# QQ web_base_url 默认适合本地；云部署必须改为真实公网 HTTPS 地址。
schema_version: 1
site:
  public_security_record:
    enabled: false
    code: 请填写公安备案编号
    label: 请填写公安备案展示文案
    allowed_hosts:
      - 请填写允许展示的域名
context:
  full_history:
    enabled: true
  history_query:
    enabled: true
    planner_fallback: true
  compaction:
    enabled: true
    trigger_budget_ratio: 0.85
    recent_keep_ratio: 0.15
    post_compaction_max_ratio: 0.35
    min_recent_turns: 8
    background_enabled: true
    background_trigger_budget_ratio: 0.8
  retrieval:
    enabled: true
    top_k: 6
    semantic_weight: 0.45
    lexical_weight: 0.3
    entity_weight: 0.15
    anchor_weight: 0.08
    recency_weight: 0.02
    min_semantic_score: 0.15
  index:
    backend: sqlite

skills:
  sync:
    on_startup: always
    log: changes_only
    background:
      enabled: false
      interval_seconds: 0
  sources:
    - name: zhice-official
      sync: true
      local_dir: "${ZHICE_AGENT_SKILL_REPO}"
      git_url:
      target: master

subagents:
  enabled: true
  max_parallel: 3
  max_tasks_per_call: 4
  max_depth: 1
  max_subagents_per_parent_turn: 6
  max_batches_per_parent_turn: 1
  max_batch_result_chars: 32000
  profiles:
    explorer:
      description: Read, search, inspect Skills, and summarize.
      tools:
        - list_dir
        - read_file
        - grep
        - load_skills
        - memory_read
      denied_tools:
        - delegate_tasks
      allowed_skills: []
      preload_skills: []
      workspace_mode: shared_readonly
      model_role: fast
      max_tool_iterations: 10
      timeout_seconds: 180
      max_result_chars: 12000
    developer:
      description:
        Inspect code, use Skills, run commands, test, and prepare isolated
        changes.
      tools:
        - list_dir
        - read_file
        - grep
        - load_skills
        - memory_read
        - exec
      denied_tools:
        - delegate_tasks
        - sync_skills
      allowed_skills: []
      preload_skills: []
      workspace_mode: worktree
      model_role: inherit
      max_tool_iterations: 20
      timeout_seconds: 600
      max_result_chars: 12000
    operator:
      description:
        Use explicitly configured MCP or operational tools under inherited
        permissions.
      tools:
        - list_dir
        - read_file
        - grep
        - load_skills
        - memory_read
        - mcp__approved__*
      denied_tools:
        - delegate_tasks
      allowed_skills: []
      preload_skills: []
      workspace_mode: shared_exclusive
      model_role: inherit
      max_tool_iterations: 15
      timeout_seconds: 300
      max_result_chars: 12000

channels:
  qq:
    enabled: true
    transport: websocket
    accounts:
      - key: main
        app_id: ${QQBOT_APP_ID}
        app_secret: ${QQBOT_APP_SECRET}
        web_base_url: http://127.0.0.1:10086
        c2c_enabled: true
        group_enabled: true
        group_require_mention: true
        max_parallel_conversations: 8
        max_attachment_bytes: 20971520
  weixin:
    enabled: true
    transport: sidecar_stdio
    node_path: node
    sidecar_entry: integrations/weixin_sidecar/dist/main.js
    binding_timeout_seconds: 480
    max_parallel_conversations: 8
    text_chunk_limit: 4000

hooks:
  version: 1
  entries: []

mcp:
  servers:
    open-meteo:
      command: python
      args:
        - -m
        - integrations.open_meteo_mcp.server
      startup_timeout_seconds: 20
      connect_timeout_seconds: 15
      call_timeout_seconds: 30
    amap-maps:
      command: npx
      args:
        - -y
        - "@amap/amap-maps-mcp-server@0.0.8"
      env:
        AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY}
      startup_timeout_seconds: 90
      connect_timeout_seconds: 30
      call_timeout_seconds: 60
    tavily:
      url: https://mcp.tavily.com/mcp
      transport: streamable_http
      proxy_mode:
      headers:
        Authorization: Bearer ${TAVILY_API_KEY}
      startup_timeout_seconds: 30
      connect_timeout_seconds: 30
      call_timeout_seconds: 60
    "12306":
      command: 12306-mcp
      args: []
      startup_timeout_seconds: 90
      connect_timeout_seconds: 30
      call_timeout_seconds: 60
    xhs-readonly:
      command: python
      args:
        - -m
        - integrations.xhs_readonly_mcp.server
      env:
        XHS_READONLY_UPSTREAM_URL: ${XHS_READONLY_UPSTREAM_URL}
        XHS_READONLY_HTTP_HOST_ALLOWLIST: ${XHS_READONLY_HTTP_HOST_ALLOWLIST}
        XHS_READONLY_COOKIE_DIR: ${XHS_READONLY_COOKIE_DIR}
        XHS_READONLY_COOKIE_FILE: ${XHS_READONLY_COOKIE_FILE}
        XHS_READONLY_TIMEOUT_SECONDS: "120"
      startup_timeout_seconds: 30
      connect_timeout_seconds: 30
      call_timeout_seconds: 120

logging: {}

travel:
  enabled: true
  max_evidence_items: 40
  max_plan_bytes: 524288

workflows:
  enabled: true
  engine: native
  max_workflows_per_user: 20
  max_active_schedules_per_user: 10
  max_nodes_per_workflow: 30
  max_edges_per_workflow: 60
  max_global_workers: 4
  max_daily_runs_per_user: 100
  max_daily_official_emails_per_user: 10
  max_daily_personal_emails_per_user: 20
  default_timezone: Asia/Shanghai
  default_misfire_grace_seconds: 900
  allowed_query_tools:
    - mcp__open-meteo__get_forecast
    - mcp__open-meteo__get_historical_weather
    - mcp__amap-maps__maps_text_search
    - mcp__amap-maps__maps_search_detail
    - mcp__tavily__tavily_search
    - mcp__12306__get-tickets
    - mcp__xhs-readonly__search_notes
    - mcp__xhs-readonly__get_note_detail
  allowed_action_tools: []

official_email:
  enabled: false
  provider: smtp
  host: "${ZHICE_SMTP_HOST}"
  port: ${ZHICE_SMTP_PORT}
  username: "${ZHICE_SMTP_USERNAME}"
  password: "${ZHICE_SMTP_PASSWORD}"
  from_address: "${ZHICE_SMTP_FROM}"
