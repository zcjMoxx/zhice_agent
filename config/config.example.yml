schema_version: 1

context:
  full_history:
    enabled: true
  history_query:
    enabled: true
    planner_fallback: true
  compaction:
    enabled: true
    trigger_budget_ratio: 0.85
    recent_keep_ratio: 0.15
    post_compaction_max_ratio: 0.35
    min_recent_turns: 8
    background_enabled: true
    background_trigger_budget_ratio: 0.80
  retrieval:
    enabled: true
    top_k: 6
    semantic_weight: 0.45
    lexical_weight: 0.30
    entity_weight: 0.15
    anchor_weight: 0.08
    recency_weight: 0.02
    min_semantic_score: 0.15
  index:
    backend: sqlite

skills:
  sync:
    on_startup: always
    log: changes_only
    background:
      enabled: false
      interval_seconds: 0
  sources:
    - name: zhice-official
      sync: true
      local_dir: "${ZHICE_AGENT_SKILL_REPO}"

subagents:
  enabled: true
  max_parallel: 3
  max_tasks_per_call: 4
  max_depth: 1
  max_subagents_per_parent_turn: 6
  max_batches_per_parent_turn: 1
  max_batch_result_chars: 32000
  profiles:
    travel-research:
      description: Research one bounded travel evidence branch using read-only MCP sources.
      tools:
        - mcp__amap-maps__*
        - mcp__tavily__*
        - mcp__12306__*
        - mcp__open-meteo__*
        - mcp__xhs-readonly__*
      denied_tools: [delegate_tasks]
      allowed_skills: []
      preload_skills: []
      workspace_mode: shared_readonly
      max_tool_iterations: 12
      timeout_seconds: 180
      max_result_chars: 12000
      allow_model_invocation: true
      model_role: fast

channels:
  qq:
    enabled: false
    transport: websocket
    # Each account may set http_timeout_seconds: 15 (allowed range: 1..60).
    # Public deployments must explicitly set web_base_url for every enabled account.
    # Example account field: web_base_url: https://agent.example.com
    # Keep accounts empty until real credentials and the real reachable URL are configured.
    accounts: []
  weixin:
    enabled: false
    transport: sidecar_stdio
    node_path: node
    sidecar_entry: integrations/weixin_sidecar/dist/main.js
    binding_timeout_seconds: 480
    max_parallel_conversations: 8
    text_chunk_limit: 4000

hooks:
  version: 1
  entries: []

mcp:
  servers:
    open-meteo:
      command: python
      args: [-m, integrations.open_meteo_mcp.server]
      startup_timeout_seconds: 15
      connect_timeout_seconds: 15
      call_timeout_seconds: 30
    # Enable after setting AMAP_MAPS_API_KEY in config/.env, then verify the
    # current upstream Tool Catalog before production use.
    # amap-maps:
    #   command: mcp-amap
    #   args: []
    #   env:
    #     AMAP_MAPS_API_KEY: "${AMAP_MAPS_API_KEY}"
    # Enable Tavily only after confirming its current authentication contract.
    # tavily:
    #   url: https://mcp.tavily.com/mcp
    #   transport: streamable_http
    #   proxy_mode: direct
    #   headers:
    #     Authorization: "Bearer ${TAVILY_API_KEY}"
    # Configure a reviewed query-only 12306 MCP command in the runtime file.
    # Never describe this community source as an official booking service.
    # 12306:
    #   command: 12306-mcp
    #   args: []
    #   startup_timeout_seconds: 60
    #   connect_timeout_seconds: 30
    #   call_timeout_seconds: 30
    # Enable the bundled catalog-level XHS adapter only with an isolated
    # upstream service account, Cookie volume, and explicit environment values.
    # xhs-readonly:
    #   command: python
    #   args: [-m, integrations.xhs_readonly_mcp.server]
    #   env:
    #     XHS_READONLY_UPSTREAM_URL: "${XHS_READONLY_UPSTREAM_URL}"
    #     XHS_READONLY_COOKIE_DIR: "${XHS_READONLY_COOKIE_DIR}"
    #     XHS_READONLY_COOKIE_FILE: "${XHS_READONLY_COOKIE_FILE}"
    #     XHS_READONLY_HTTP_HOST_ALLOWLIST: "${XHS_READONLY_HTTP_HOST_ALLOWLIST}"
    # For local process mode, a loopback XHS_READONLY_UPSTREAM_URL makes the
    # Gateway supervise the fixed binary under integrations/xhs/bin. Docker
    # and remote HTTPS upstreams remain independently managed sidecars.

travel:
  enabled: true
  default_mode: quick
  max_search_results: 8
  max_evidence_items: 40
  deep_subagent_count: 3
  xhs_readonly_enabled: true
  max_plan_bytes: 524288

logging: {}

# Non-secret projection of the independently protected Ops terminal.
# Production deployments must use an explicit HTTPS URL protected by
# Cloudflare Tunnel + Access. The main Web never proxies terminal traffic.
operations:
  terminal:
    enabled: false
    url: ""
    presentation: both
