channels:
  qq:
    enabled: false
    transport: websocket
    accounts:
      - key: main
        app_id: ${QQBOT_APP_ID}
        app_secret: ${QQBOT_APP_SECRET}
        web_base_url: http://127.0.0.1:10086
        c2c_enabled: true
        group_enabled: true
        group_require_mention: true
        max_parallel_conversations: 8
        max_attachment_bytes: 20971520
